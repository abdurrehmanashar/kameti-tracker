<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kameti Tracker</title>
<meta name="theme-color" content="#101519"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#101519;--surface:#151c21;--surface-soft:#1b242a;--tx:#f3efe6;--mu:#93a0aa;--bd:#27313a;--ac:#c9a24d;--acx:#14181c;--gold:#c9a24d;--focus:#c9a24d;--ok:#4f9a76;--bad:#c4695c;
 --serif:"Fraunces","Palatino Linotype","Book Antiqua",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang=ur]{--serif:"Noto Naskh Arabic",Tahoma,serif}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.55 "IBM Plex Sans","Aptos","Segoe UI","Noto Naskh Arabic",Tahoma,system-ui,sans-serif}
#app{max-width:880px;margin:0 auto;padding:8px 22px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px max(22px,calc((100% - 836px)/2));border-bottom:1px solid var(--bd)}
.top span{display:flex;gap:8px;align-items:center}
#ttl{font:600 21px/1.2 var(--serif);letter-spacing:-.01em}
nav{display:flex;gap:26px;margin:0 0 18px;border-bottom:1px solid var(--bd)}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:4px;padding:18px;margin:12px 0}
.card>b{font:600 18px/1.35 var(--serif)}
button,.btn{font:inherit;font-weight:500;min-height:44px;padding:9px 16px;border-radius:3px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background-color .16s ease,border-color .16s ease,color .16s ease}
button:hover,.btn:hover{border-color:var(--gold);color:var(--gold)}
button:active,.btn:active{transform:translateY(1px)}
button.on,.btn.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.on:hover,.btn.on:hover{filter:brightness(1.1)}
nav button{flex:0 0 auto;min-height:48px;padding:0 2px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mu)}
nav button:hover{color:var(--tx);border-bottom-color:var(--bd)}
nav button.on{background:none;color:var(--gold);border-bottom-color:var(--gold)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--focus),transparent 55%);outline-offset:2px}
[hidden]{display:none!important}
.seg,.row{display:flex;align-items:center;gap:8px;margin:10px 0}
.seg button{flex:1;min-width:0;padding:8px 6px}
.seg button[data-v="p"].on{background:#2f6b4f;border-color:#2f6b4f;color:var(--tx)}
.seg button[data-v="h"].on{background:var(--gold);border-color:var(--gold);color:var(--acx)}
.seg button[data-v="u"].on{background:#a8473b;border-color:#a8473b;color:var(--tx)}
.row>*{flex:1 1 150px;min-width:0}
label{display:block;margin:10px 0 4px;font-weight:500}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:9px 11px;margin:5px 0;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--tx)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
textarea{min-height:145px;resize:vertical}
hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
.mu{color:var(--mu);font-size:14px}.cur{font-weight:700;color:var(--gold)}.lg{font-size:13px;border-top:1px solid var(--bd);padding:7px 0}.lg span{font:12px var(--mono)}
#tt{position:fixed;z-index:5;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:848px;margin:auto;background:var(--surface-soft);color:var(--tx);padding:12px 16px;border:1px solid var(--gold);border-radius:3px;text-align:center}
#pr{display:none}
.hero{padding:22px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
html[lang=ur] .eyebrow{font:600 14px/1.4 inherit;letter-spacing:0;text-transform:none}
.big{font:600 40px/1.1 var(--serif);margin:10px 0 12px;letter-spacing:-.01em}.big small{font:400 15px/1 "IBM Plex Sans","Segoe UI",sans-serif;color:var(--mu);letter-spacing:0}
.bar{height:6px;border-radius:3px;background:var(--surface-soft);overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s ease}
.pot{margin:6px 0 4px}.wide{width:100%;margin:12px 0 4px}
.mem{border-inline-start:3px solid var(--bd)}.mem.s-p{border-inline-start-color:var(--ok)}.mem.s-h{border-inline-start-color:var(--gold)}.mem.s-u{border-inline-start-color:var(--bad)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mh b{font:600 19px/1.3 var(--serif)}
.dt{margin:6px 0 0}.dt summary{cursor:pointer;color:var(--mu);min-height:44px;display:flex;align-items:center}.dt[open] summary{margin-bottom:4px}
.empty{text-align:center;padding:28px 18px}
html[lang=ur] body{font-size:18px;line-height:1.85}
@media(max-width:640px){.top{padding-inline:16px}#app{padding-inline:16px;padding-bottom:96px}.big{font-size:34px}
 nav{position:fixed;inset-inline:0;bottom:0;z-index:4;gap:0;margin:0;padding:0 8px env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--bd);border-bottom:0}
 nav button{flex:1;min-height:54px;border-bottom:0;border-top:2px solid transparent;font-size:14px}nav button:hover{border-top-color:transparent}nav button.on{border-top-color:var(--gold)}
 #tt{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media(max-width:520px){.card{padding:14px;margin:10px 0}.row{flex-wrap:wrap}.row>*{flex-basis:calc(50% - 4px)}}
@media(max-width:360px){.row>*{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:12px}}
</style></head>
<body>
<div class="top"><b id="ttl"></b><span><button id="lockb" data-act="lock" hidden>🔒</button> <button id="authb" data-act="logout" hidden>Sign out</button> <button id="lang" data-act="ui"></button></span></div>
<div id="app"></div><div id="pr"></div><div id="tt" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
const KEY='kameti_v1';
const D0=()=>({name:'',amount:'',due:'',members:[],order:[],round:1,pay:{},log:[],ui:'en',ml:'en',dues:{},payout:{},pin:''});let S=D0(),tab='collect',hid,qi=0,locked=false;
try{const x=localStorage.getItem(KEY);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let client=null,user=null,syncReady=false,syncTimer,legacyPending=false;
const save=()=>{try{localStorage.setItem(user?KEY+':'+user.id:KEY,JSON.stringify(S))}catch(e){}
 if(client&&user&&syncReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,500)}};
async function syncNow(){if(!client||!user||!syncReady)return;const owner=user,payload=JSON.parse(JSON.stringify(S));try{const {error}=await client.from('kameti_trackers').upsert({user_id:owner.id,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)show('Sync failed: '+error.message);else{if(legacyPending){localStorage.removeItem(KEY);legacyPending=false}show('Synced')}}catch(e){show('Sync failed: '+e.message)}}
function configureClient(){const c=window.APP_CONFIG||{},url=(c.url||'').trim(),key=(c.key||'').trim();if(!url||!key){show('Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in the server environment.');return false}try{new URL(url)}catch(e){show('Supabase URL is invalid.');return false}if(!window.supabase||!window.supabase.createClient){show('Supabase client could not load. Check your internet connection.');return false}try{client=window.supabase.createClient(url,key);return true}catch(e){show('Could not connect to Supabase.');return false}}
async function loadAccount(account){user=account;syncReady=false;let result=await client.from('kameti_trackers').select('data').eq('user_id',user.id).maybeSingle();if(result.error){user=null;show('Could not load tracker: '+result.error.message);render();return}
 let cached=null,legacy=null;try{cached=JSON.parse(localStorage.getItem(KEY+':'+user.id)||'null');legacy=localStorage.getItem(KEY)?JSON.parse(localStorage.getItem(KEY)):null}catch(e){}
 if(result.data&&result.data.data)S=Object.assign(D0(),result.data.data);else if(cached)S=Object.assign(D0(),cached);else if(legacy){S=Object.assign(D0(),legacy);legacyPending=true}else S=D0();
 syncReady=true;locked=!!S.pin;if(!S.members.length)tab='setup';save();render()}
async function boot(){if(!configureClient()){render();return}const {data,error}=await client.auth.getSession();if(error){show('Could not check sign-in: '+error.message);render();return}if(data.session)await loadAccount(data.session.user);else render()}
const AU={email:'Email',password:'Password',signin:'Sign in',signup:'Create account',note:'Sign in to open your committee record. It is saved privately to your account, so you can open it on any phone.'};
const T={en:{app:'Kameti Tracker',collect:'Collect',order:'Order',setup:'Setup',backup:'Backup',empty:'Add your members in Setup first.',round:'Round',payout:'Payout to',paid:'Paid',part:'Part',unpaid:'Unpaid',cash:'Cash',transfer:'Transfer',amt:'Amount (Rs)',remind:'Remind',confirm:'Send receipt',nophone:'No phone number',msgl:'Message language',grp:'Copy group update',stmt:'Copy statement',copied:'Copied',of:'of',paidn:'paid',cname:'Committee name',monthly:'Amount per round (Rs)',due:'Due (e.g. 5th of each month)',mems:'Members',hint:'One per line: name, WhatsApp number',savebtn:'Save',draw:'Draw order',locked:'Order is locked once payments exist. Use Swap.',swap:'Swap turns',why:'Reason / who agreed',hist:'History',copy:'Copy backup',restore:'Restore from backup',bad:'That backup could not be read.',done:'Restored',priv:'Data stays on this phone only. Back it up regularly.',saved:'Saved',dd:'Due date',dl:'days left',ov:'days overdue',nt:'Grace / note',rq:'Remind unpaid',nx:'Next',dn:'Done',sms:'SMS',st:'Statement',col:'Collected',sh:'short',po:'Payout given',pd:'Date',pa:'Amount received',pset:'Record payout',pclr:'Clear',csv:'Download CSV',prt:'Print statement',pin:'PIN (4 digits, optional)',pset2:'Set PIN',prm:'Remove PIN',unl:'Unlock',wr:'Wrong PIN',pnote:'A PIN is a casual lock, not encryption.',nou:'Nobody left to remind.',pins:'PIN saved',more:'More',lang:'اردو'},
ur:{app:'کمیٹی ٹریکر',collect:'وصولی',order:'ترتیب',setup:'سیٹ اپ',backup:'بیک اپ',empty:'پہلے سیٹ اپ میں ممبران شامل کریں۔',round:'راؤنڈ',payout:'باری',paid:'ادا',part:'جزوی',unpaid:'باقی',cash:'نقد',transfer:'ٹرانسفر',amt:'رقم (روپے)',remind:'یاد دہانی',confirm:'رسید بھیجیں',nophone:'نمبر موجود نہیں',msgl:'پیغام کی زبان',grp:'گروپ اپڈیٹ کاپی کریں',stmt:'حساب کاپی کریں',copied:'کاپی ہو گیا',of:'میں سے',paidn:'ادا',cname:'کمیٹی کا نام',monthly:'فی راؤنڈ رقم (روپے)',due:'آخری تاریخ (مثلاً ہر ماہ 5)',mems:'ممبران',hint:'ہر لائن میں ایک: نام، واٹس ایپ نمبر',savebtn:'محفوظ کریں',draw:'قرعہ اندازی',locked:'ادائیگی شروع ہونے کے بعد ترتیب بند ہے۔ باری بدلیں استعمال کریں۔',swap:'باری بدلیں',why:'وجہ / کس نے منظور کیا',hist:'ریکارڈ',copy:'بیک اپ کاپی کریں',restore:'بیک اپ سے بحال کریں',bad:'بیک اپ پڑھا نہیں جا سکا۔',done:'بحال ہو گیا',priv:'ڈیٹا صرف اسی فون میں رہتا ہے۔ باقاعدگی سے بیک اپ لیں۔',saved:'محفوظ ہو گیا',dd:'آخری تاریخ',dl:'دن باقی',ov:'دن تاخیر',nt:'مہلت / نوٹ',rq:'باقی کو یاد دلائیں',nx:'اگلا',dn:'ختم',sms:'ایس ایم ایس',st:'حساب',col:'وصول',sh:'کمی',po:'باری کی رقم دی گئی',pd:'تاریخ',pa:'وصول شدہ رقم',pset:'ریکارڈ کریں',pclr:'مٹائیں',csv:'CSV ڈاؤن لوڈ',prt:'حساب پرنٹ کریں',pin:'پن (4 ہندسے، اختیاری)',pset2:'پن لگائیں',prm:'پن ہٹائیں',unl:'کھولیں',wr:'غلط پن',pnote:'پن سرسری تالا ہے، انکرپشن نہیں۔',nou:'یاد دلانے کو کوئی باقی نہیں۔',pins:'پن محفوظ',more:'مزید',lang:'English'}};
const MT={en:{ok:'Hello {n}, your payment of Rs {a} for {c} (round {r}) is received. Thank you. Your payout is in round {p}.',rm:'Hello {n}, a gentle reminder: Rs {a} for {c} (round {r}) is due {d}.',gp:'{c} round {r}: {k} of {t} paid. Payout this round: {w}.',st:'Hello {n}, statement for {c}: {h}. Total paid Rs {t}. Your payout is in round {p}.',d:'soon'},
ro:{ok:'Assalam o Alaikum {n}, {c} ki round {r} ke Rs {a} mil gaye. Shukriya. Aap ki baari round {p} mein hai.',rm:'Assalam o Alaikum {n}, yaad dahani: {c} ki round {r} ke Rs {a} {d} tak dene hain.',gp:'{c} round {r}: {t} mein se {k} ne de diye. Is round ki baari: {w}.',st:'Assalam o Alaikum {n}, {c} ka hisaab: {h}. Kul ada Rs {t}. Aap ki baari round {p} mein hai.',d:'muqarrar tareekh'},
ur:{ok:'السلام علیکم {n}، {c} کی راؤنڈ {r} کے Rs {a} موصول ہو گئے۔ شکریہ۔ آپ کی باری راؤنڈ {p} میں ہے۔',rm:'السلام علیکم {n}، یاد دہانی: {c} کی راؤنڈ {r} کے Rs {a} {d} تک دینے ہیں۔',gp:'{c} راؤنڈ {r}: {t} میں سے {k} نے ادا کر دیے۔ اس راؤنڈ کی باری: {w}۔',st:'السلام علیکم {n}، {c} کا حساب: {h}۔ کل ادا Rs {t}۔ آپ کی باری راؤنڈ {p} میں ہے۔',d:'مقررہ تاریخ'}};
const t=k=>T[S.ui][k]||k;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem=id=>S.members.find(m=>m.id===id)||{name:'?'};
const pay=(r,id)=>S.pay[r+':'+id]||{s:'u',m:'cash',a:''};
const log=x=>{S.log.unshift({t:Date.now(),x});S.log=S.log.slice(0,200)};
const nR=()=>Math.min(S.round,S.members.length||1);
const dstr=d=>d?new Date(d+'T00:00').toLocaleDateString():'';
const dleft=d=>d?Math.round((new Date(d+'T00:00')-new Date().setHours(0,0,0,0))/864e5):null;
const hs=x=>{let h=5381;for(const c of 'k'+x)h=(h*33^c.charCodeAt(0))>>>0;return String(h)};
function tot(r){const amt=Number(S.amount)||0;let c=0;S.members.forEach(m=>{const p=pay(r,m.id);if(p.s==='p')c+=Number(p.a)||amt;else if(p.s==='h')c+=Number(p.a)||0});return c}
function stm(m){const n=nR(),amt=Number(S.amount)||0;let h=[],tt=0;for(let r=1;r<=n;r++){const p=pay(r,m.id);h.push('R'+r+(p.s==='p'?' ✓':p.s==='h'?' ½':' ✗'));tt+=p.s==='p'?Number(p.a)||amt:p.s==='h'?Number(p.a)||0:0}
 return fill(MT[S.ml].st,{n:m.name,c:S.name||'Kameti',h:h.join(', '),t:tt,p:S.order.indexOf(m.id)+1})}
const fill=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]==null?'':o[k]);
function msg(kind,m,a){const r=nR(),p=S.order.indexOf(m.id)+1,L=MT[S.ml];
 return fill(L[kind],{n:m.name,c:S.name||'Kameti',a:a,r:r,p:p,d:S.dues[r]?dstr(S.dues[r]):(S.due||L.d)})}
const ph=m=>{let p=(m.phone||'').replace(/\D/g,'');if(p[0]==='0')p='92'+p.slice(1);return p};
const wa=(m,x)=>{const p=ph(m);return p?'https://wa.me/'+p+'?text='+encodeURIComponent(x):''};
const sm=(m,x)=>{const p=ph(m);return p?'sms:+'+p+'?body='+encodeURIComponent(x):''};
function show(m){const e=document.getElementById('tt');e.textContent=m;e.hidden=false;clearTimeout(hid);hid=setTimeout(()=>e.hidden=true,2500)}
function copy(x){const fb=()=>{const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();show(ok?t('copied'):x)};
 try{navigator.clipboard.writeText(x).then(()=>show(t('copied')),fb)}catch(e){fb()}}
const lbl=v=>({p:'paid',h:'part',u:'unpaid'}[v]);
function vCollect(){
 if(!S.members.length)return`<div class="card empty"><p>${t('empty')}</p><button class="on" data-act="tab" data-v="setup">${t('setup')}</button></div>`;
 const r=nR(),w=mem(S.order[r-1]),amt=Number(S.amount)||0;
 let k=0;S.members.forEach(m=>{if(pay(r,m.id).s==='p')k++});
 const col=tot(r),tot0=amt*S.members.length,dl=dleft(S.dues[r]),pr=S.payout[r],
 po=pr?`<div class="mu">${t('po')}: ${esc(dstr(pr.d))} · Rs ${esc(pr.a)} <button data-act="pclr">${t('pclr')}</button></div>`:`<div class="row"><input id="pd" type="date" aria-label="${t('pd')}"><input id="pa" type="number" inputmode="numeric" placeholder="${t('pa')}" value="${tot0}"><button data-act="poset">${t('pset')}</button></div>`;
 const rows=S.members.map(m=>{const p=pay(r,m.id);let a=p.s==='p'?(p.a||amt):Math.max(amt-(Number(p.a)||0),0),kind=p.s==='p'?'ok':'rm',h=wa(m,msg(kind,m,a));
  return`<div class="card mem s-${p.s}"><div class="mh"><b>${esc(m.name)}</b>${p.s==='h'?`<span class="mu">Rs ${esc(p.a||0)} / ${amt}</span>`:''}</div><div class="seg">${['p','h','u'].map(v=>`<button class="${p.s===v?'on':''}" data-act="st" data-id="${m.id}" data-v="${v}">${t(lbl(v))}</button>`).join('')}</div>
  ${p.s!=='u'?`<div class="row"><select data-act="mt" data-id="${m.id}"><option value="cash"${p.m==='cash'?' selected':''}>${t('cash')}</option><option value="transfer"${p.m==='transfer'?' selected':''}>${t('transfer')}</option></select>${p.s==='h'?`<input type="number" inputmode="numeric" data-act="am" data-id="${m.id}" value="${esc(p.a)}" placeholder="${t('amt')}">`:''}</div>`:''}
  ${p.s!=='p'?`<input data-act="nt" data-id="${m.id}" value="${esc(p.n||'')}" placeholder="${t('nt')}">`:''}
  ${h?`<div class="row"><a class="btn${p.s==='p'?'':' on'}" target="_blank" rel="noopener" href="${h}">${t(p.s==='p'?'confirm':'remind')}</a></div><details class="dt"><summary>${t('more')}</summary><div class="row"><a class="btn" href="${sm(m,msg(kind,m,a))}">${t('sms')}</a><a class="btn" target="_blank" rel="noopener" href="${wa(m,stm(m))}">${t('st')}</a></div></details>`:`<span class="mu">${t('nophone')}</span>`}</div>`}).join('');
 const pct=tot0?Math.min(100,Math.round(col/tot0*100)):0,left=S.members.length-k;
 return`<div class="card hero"><div class="row"><select data-act="rd">${S.members.map((m,i)=>`<option value="${i+1}"${i+1===r?' selected':''}>${t('round')} ${i+1}</option>`).join('')}</select>
 <select data-act="ml"><option value="en"${S.ml==='en'?' selected':''}>English</option><option value="ro"${S.ml==='ro'?' selected':''}>Roman Urdu</option><option value="ur"${S.ml==='ur'?' selected':''}>اردو</option></select></div>
 <div class="eyebrow">${t('col')}</div><div class="big">Rs ${col}<small> ${t('of')} ${tot0}</small></div><div class="bar" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
 <div class="mu">${k} ${t('of')} ${S.members.length} ${t('paidn')}${tot0>col?' · '+t('sh')+' Rs '+(tot0-col):''}</div>
 <div class="pot">${t('payout')}: <b>${esc(w.name)}</b></div>
 <div class="row"><label>${t('dd')}<input type="date" data-act="due" value="${esc(S.dues[r]||'')}"></label><span class="mu">${dl===null?'':dl>=0?dl+' '+t('dl'):(-dl)+' '+t('ov')}</span></div>
 ${left?`<button class="on wide" data-act="rq">${t('rq')} (${left})</button>`:''}
 <details class="dt"><summary>${t('more')}</summary>${po}<div class="row"><button data-act="grp">${t('grp')}</button><button data-act="stmt">${t('stmt')}</button></div><div class="row"><button data-act="prt">${t('prt')}</button><button data-act="csv">${t('csv')}</button></div></details></div>${rows}`}
function vQueue(){
 const r=nR(),L=S.members.filter(m=>pay(r,m.id).s!=='p');
 if(qi>=L.length)return`<div class="card">${t('nou')}<br><button data-act="qx">${t('dn')}</button></div>`;
 const m=L[qi],p=pay(r,m.id),a=Math.max((Number(S.amount)||0)-(Number(p.a)||0),0),x=msg('rm',m,a),h=wa(m,x);
 return`<div class="card"><b>${qi+1} ${t('of')} ${L.length}: ${esc(m.name)}</b><p class="mu">${esc(x)}</p>${h?`<div class="row"><a class="btn on" target="_blank" rel="noopener" href="${h}">WhatsApp</a><a class="btn" href="${sm(m,x)}">${t('sms')}</a></div>`:`<span class="mu">${t('nophone')}</span>`}<div class="row"><button data-act="qn">${t('nx')}</button><button data-act="qx">${t('dn')}</button></div></div>`}
function vOrder(){
 if(!S.members.length)return`<div class="card empty"><p>${t('empty')}</p><button class="on" data-act="tab" data-v="setup">${t('setup')}</button></div>`;
 const o=S.order.map(i=>`<option value="${i}">${esc(mem(i).name)}</option>`).join('');
 return`<div class="card"><ol>${S.order.map((i,k)=>`<li class="${k+1===nR()?'cur':''}">${esc(mem(i).name)}</li>`).join('')}</ol><button data-act="draw">${t('draw')}</button></div>
 <div class="card"><b>${t('swap')}</b><div class="row"><select id="sa">${o}</select><select id="sb">${o}</select></div><input id="sn" placeholder="${t('why')}"><button data-act="swap">${t('swap')}</button></div>
 <div class="card"><b>${t('hist')}</b>${S.log.slice(0,40).map(l=>`<div class="lg"><span class="mu">${new Date(l.t).toLocaleString()}</span> ${esc(l.x)}</div>`).join('')}</div>`}
function vSetup(){
 return`<div class="card"><label>${t('cname')}<input id="n" value="${esc(S.name)}"></label><label>${t('monthly')}<input id="a" type="number" inputmode="numeric" value="${esc(S.amount)}"></label>
 <label>${t('due')}<input id="d" value="${esc(S.due)}"></label><label>${t('mems')}<span class="mu"> ${t('hint')}</span><textarea id="mb" rows="8">${esc(S.members.map(m=>m.name+(m.phone?', '+m.phone:'')).join('\n'))}</textarea></label>
 <button class="on" data-act="setup">${t('savebtn')}</button></div><div class="card"><label>${t('pin')}<input id="pn" type="password" inputmode="numeric" maxlength="4"></label><div class="row"><button data-act="pin">${t('pset2')}</button>${S.pin?`<button data-act="pinx">${t('prm')}</button>`:''}</div><p class="mu">${t('pnote')}</p></div>`}
function vAuth(){return`<div class="card"><b>${t('app')}</b><p class="mu">${AU.note}</p><label>${AU.email}<input id="em" type="email" autocomplete="username"></label><label>${AU.password}<input id="pw" type="password" autocomplete="current-password"></label><div class="row"><button class="on" data-act="signin">${AU.signin}</button><button data-act="signup">${AU.signup}</button></div></div>`}
function vBackup(){
 return`<div class="card"><p class="mu">${t('priv')}</p><textarea id="bk" rows="8">${esc(JSON.stringify(S))}</textarea><div class="row"><button data-act="copybk">${t('copy')}</button><button data-act="restore">${t('restore')}</button></div></div>`}
function render(){
 const h=document.documentElement;h.lang=S.ui==='ur'?'ur':'en';h.dir=S.ui==='ur'?'rtl':'ltr';document.getElementById('ttl').textContent=S.name||t('app');
 if(!user){document.getElementById('lockb').hidden=true;document.getElementById('authb').hidden=true;document.getElementById('lang').textContent=t('lang');document.getElementById('app').innerHTML=vAuth();return}
 document.getElementById('authb').hidden=false;
 if(locked){document.getElementById('app').innerHTML=`<div class="card"><input id="pu" type="password" inputmode="numeric" maxlength="4" placeholder="PIN"><button class="on" data-act="unl">${t('unl')}</button></div>`;document.getElementById('lockb').hidden=true;return}
 document.getElementById('lockb').hidden=!S.pin;
 document.getElementById('lang').textContent=t('lang');
 const V={collect:vCollect,order:vOrder,setup:vSetup,backup:vBackup,queue:vQueue};
 document.getElementById('app').innerHTML=`<nav>${['collect','order','setup','backup'].map(k=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${t(k)}</button>`).join('')}</nav>`+V[tab]();
 const sb=document.getElementById('sb');if(sb&&sb.options.length>1)sb.selectedIndex=1}
const A={
 signin:async()=>{if(!client){show('Supabase is not configured on the server.');return}const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});if(error)show(error.message);else await loadAccount(data.user)},
 signup:async()=>{if(!client){show('Supabase is not configured on the server.');return}const {data,error}=await client.auth.signUp({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});if(error)show(error.message);else if(data.session)await loadAccount(data.user);else show('Check your email to confirm your account, then sign in.')},
 logout:async()=>{await syncNow();const {error}=await client.auth.signOut();if(error){show(error.message);return}user=null;syncReady=false;S=D0();locked=false;show('Signed out')},
 due:e=>{S.dues[nR()]=e.value;log(`R${nR()} due ${e.value}`)},
 nt:e=>{const r=nR(),id=e.dataset.id;S.pay[r+':'+id]=Object.assign({},pay(r,id),{n:e.value});log(`R${r}: ${mem(id).name} note: ${e.value}`)},
 poset:()=>{const d=document.getElementById('pd').value,a=document.getElementById('pa').value;if(!d)return;S.payout[nR()]={d:d,a:a};log(`R${nR()}: payout to ${mem(S.order[nR()-1]).name} Rs ${a} on ${d}`)},
 pclr:()=>{delete S.payout[nR()];log(`R${nR()}: payout record cleared`)},
 rq:()=>{qi=0;tab='queue'},qn:()=>{qi++},qx:()=>{tab='collect'},
 pin:()=>{const v=document.getElementById('pn').value;if(/^\d{4}$/.test(v)){S.pin=hs(v);show(t('pins'))}},
 pinx:()=>{S.pin=''},lock:()=>{locked=true},
 unl:()=>{if(hs(document.getElementById('pu').value)===S.pin)locked=false;else show(t('wr'))},
 prt:()=>{const r=nR(),amt=Number(S.amount)||0;document.getElementById('pr').innerHTML=`<h2>${esc(S.name||'Kameti')} – ${t('round')} ${r}</h2><p>${t('dd')}: ${esc(dstr(S.dues[r]))} · ${t('col')} Rs ${tot(r)} ${t('of')} ${amt*S.members.length}</p><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">${S.members.map((m,i)=>{const p=pay(r,m.id);return`<tr><td>${i+1}</td><td>${esc(m.name)}</td><td>${t(lbl(p.s))}</td><td>${p.s==='u'?'':esc(p.m)}</td><td>${p.s==='p'?esc(p.a||amt):esc(p.a)}</td><td>${esc(p.n||'')}</td></tr>`}).join('')}</table>`;window.print()},
 csv:()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',amt=Number(S.amount)||0,rows=[['round','member','status','method','amount','due','note']];
  for(let r=1;r<=S.members.length;r++)S.members.forEach(m=>{const p=pay(r,m.id);rows.push([r,m.name,lbl(p.s),p.s==='u'?'':p.m,p.s==='p'?(p.a||amt):p.a,S.dues[r]||'',p.n||''])});
  const x=rows.map(a=>a.map(q).join(',')).join('\n');
  try{const u=URL.createObjectURL(new Blob(['\ufeff'+x],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download=(S.name||'kameti')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){copy(x)}},
 tab:e=>{tab=e.dataset.v},
 ui:()=>{S.ui=S.ui==='en'?'ur':'en'},
 ml:e=>{S.ml=e.value},
 rd:e=>{S.round=+e.value},
 st:e=>{const r=nR(),id=e.dataset.id,p=Object.assign({},pay(r,id),{s:e.dataset.v});
  if(p.s==='p')p.a=S.amount;if(p.s==='u')p.a='';S.pay[r+':'+id]=p;log(`R${r}: ${mem(id).name} → ${lbl(p.s)}${p.s!=='u'?' ('+p.m+')':''}`)},
 mt:e=>{const r=nR(),id=e.dataset.id;S.pay[r+':'+id]=Object.assign({},pay(r,id),{m:e.value});log(`R${r}: ${mem(id).name} method → ${e.value}`)},
 am:e=>{const r=nR(),id=e.dataset.id;S.pay[r+':'+id]=Object.assign({},pay(r,id),{a:e.value});log(`R${r}: ${mem(id).name} part payment Rs ${e.value}`)},
 grp:()=>{const r=nR();let k=0;S.members.forEach(m=>{if(pay(r,m.id).s==='p')k++});
  copy(fill(MT[S.ml].gp,{c:S.name||'Kameti',r:r,k:k,t:S.members.length,w:mem(S.order[r-1]).name}))},
 stmt:()=>{const r=nR();copy((S.name||'Kameti')+' – '+t('round')+' '+r+'\n'+S.members.map((m,i)=>{const p=pay(r,m.id);return(i+1)+'. '+m.name+' – '+t(lbl(p.s))+(p.s==='h'&&p.a?' ('+p.a+')':'')}).join('\n'))},
 draw:()=>{if(Object.keys(S.pay).length){show(t('locked'));return}
  const o=S.order.slice();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  S.order=o;log('Draw: '+o.map(i=>mem(i).name).join(', '))},
 swap:()=>{const a=document.getElementById('sa').value,b=document.getElementById('sb').value,n=document.getElementById('sn').value.trim();
  if(a===b)return;const i=S.order.indexOf(a),j=S.order.indexOf(b);S.order[i]=b;S.order[j]=a;log(`Swap: ${mem(a).name} ↔ ${mem(b).name}${n?' ('+n+')':''}`)},
 setup:()=>{const g=i=>document.getElementById(i).value;S.name=g('n').trim();S.amount=g('a').trim();S.due=g('d').trim();
  const ms=g('mb').split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{const i=l.indexOf(','),name=(i<0?l:l.slice(0,i)).trim(),o=S.members.find(m=>m.name===name);
   return{id:o?o.id:'m'+Math.random().toString(36).slice(2,8),name:name,phone:i<0?'':l.slice(i+1).trim()}});
  const ids=ms.map(m=>m.id);S.order=S.order.filter(i=>ids.includes(i)).concat(ids.filter(i=>!S.order.includes(i)));S.members=ms;
  log('Setup saved ('+ms.length+' members)');tab='collect';show(t('saved'))},
 copybk:()=>copy(JSON.stringify(S)),
 restore:()=>{try{const o=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(o.members))throw 0;S=Object.assign(D0(),o);show(t('done'))}catch(e){show(t('bad'))}}
};
async function run(e){const action=e.dataset.act,f=A[action];if(f){await f(e);if(!['signin','signup','logout'].includes(action))save();render()}}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(e&&!['SELECT','INPUT'].includes(e.tagName))run(e)});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-act]');if(e&&['SELECT','INPUT'].includes(e.tagName))run(e)});
locked=false;if(!S.members.length)tab='setup';
render();boot();
</script></body></html>
